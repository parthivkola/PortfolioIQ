services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pip_user
      POSTGRES_PASSWORD: pip_password
      POSTGRES_DB: portfolio_intelligence
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pip_user -d portfolio_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
