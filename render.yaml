# Render Blueprint -- deploy all three services from one file.
# https://docs.render.com/infrastructure-as-code

services:
  # --- Web Service (your FastAPI app) ---
  - type: web
    name: portfolio-iq
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-iq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: portfolio-iq-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: WARNING

  # --- Redis ---
  - type: redis
    name: portfolio-iq-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

# --- PostgreSQL ---
databases:
  - name: portfolio-iq-db
    plan: free
    databaseName: portfolio_intelligence
    user: pip_user

